name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest pip-audit
      - name: Dependency audit
        run: pip-audit -r api/requirements.txt
      - name: Unit tests
        run: python -m pytest api/tests/ -v
      - name: Import smoke test
        run: python -c "from api.index import app; print('FastAPI app imports and boots:', app.title)"

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Install Chromium (only test_ssrf_route_guard.py needs a real browser)
        run: playwright install --with-deps chromium
      - name: Unit tests
        run: python -m pytest tests/ -v
